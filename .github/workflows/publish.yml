# Builds and publishes every artifact this fork ships to our own OCI registry.
#
# Upstream CI lives in NVIDIA's internal GitLab and is not mirrored here, so this is the only
# thing building the fork. It calls the make targets directly rather than `make release`, which
# would also invoke the vpc targets and those clone an internal GitLab repo.
#
# Each architecture is built on a native runner and pushed under an arch suffixed tag, then a
# third job assembles the manifest lists. That keeps every stage native, so nothing is emulated.
name: publish

on:
  push:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every image is $(REGISTRY)/$(NAME) and HELM_REGISTRY derives oci://$(REGISTRY), so the
  # dpf/ namespace applies to images and charts alike without a Makefile change.
  REGISTRY: oci.s3rj1k.fyi/dpf
  # The six images the Makefile builds per architecture through docker-build-<name>-for-%.
  MULTI_ARCH_IMAGES: dpf-system hostdriver storage-system storage-host bfb-registry keepalived

jobs:
  images:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            arch: arm64
          - runner: ubuntu-24.04
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      # Eight images, several Ubuntu based, against roughly 14 GB free on a stock runner.
      # Runs first because tool-cache clears /opt/hostedtoolcache, which is where setup-go
      # installs Go. Doing it afterwards deletes the toolchain that was just installed.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          large-packages: false
          docker-images: false

      - uses: actions/checkout@v7
        with:
          # third_party/forked/nvidia-external-attacher, which the storage images build against.
          submodules: recursive

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: docker/setup-buildx-action@v4

      # Each build and verify target downloads its own pinned toolchain into hack/tools/bin.
      - name: Cache pinned tools
        uses: actions/cache@v5
        with:
          path: hack/tools/bin
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/tools/tools.mk') }}
          restore-keys: tools-${{ runner.os }}-${{ runner.arch }}-

      - uses: docker/login-action@v4
        with:
          registry: oci.s3rj1k.fyi
          username: ${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_TOKEN }}

      # The Makefile shells out to go at parse time and go install builds every pinned tool,
      # so a missing toolchain otherwise surfaces as a confusing error inside a make recipe.
      - name: Check the build dependencies
        run: |
          go version
          make --version | head -1
          docker buildx version
          git --version

      # Helm packages the chart with this as its version, so it has to be valid semver. A
      # bare sha is not, and the images and charts share one tag because the chart values
      # reference the image tag.
      - name: Resolve the tag
        run: echo "TAG=v0.0.0-sha.$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # DPF_SYSTEM_ARCH drives which docker-build-<name>-for-% variants run, so restricting it
      # to this leg's architecture is all that is needed to split the build.
      - name: Build the per architecture images
        run: |
          make DPF_SYSTEM_ARCH=${{ matrix.arch }} \
            $(for i in $MULTI_ARCH_IMAGES; do printf 'docker-build-%s ' "$i"; done)

      - name: Push the per architecture images
        run: |
          for image in $(make --eval='__p: ; @echo $(DPF_SYSTEM_IMAGE) $(HOSTDRIVER_IMAGE) $(STORAGE_SYSTEM_IMAGE) $(STORAGE_HOST_IMAGE) $(BFB_REGISTRY_IMAGE) $(KEEPALIVED_IMAGE)' __p); do
            docker push "$image:$TAG-${{ matrix.arch }}"
          done

      # ovs-cni and cni-installer only ever run on a DPU. cni-installer pins
      # --platform=linux/$(DPU_ARCH) outright, and neither carries an arch suffix, so they are
      # built once on the native arm64 leg and pushed under the plain tag.
      - name: Build and push the DPU only images
        if: matrix.arch == 'arm64'
        run: |
          make docker-build-ovs-cni docker-build-cni-installer
          make docker-push-ovs-cni docker-push-cni-installer

  manifest:
    needs: images
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: oci.s3rj1k.fyi
          username: ${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_TOKEN }}

      # Helm packages the chart with this as its version, so it has to be valid semver. A
      # bare sha is not, and the images and charts share one tag because the chart values
      # reference the image tag.
      - name: Resolve the tag
        run: echo "TAG=v0.0.0-sha.$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # imagetools works from the registry rather than from local images, which is what lets the
      # two architectures have been built on different machines.
      - name: Assemble the manifest lists
        run: |
          for image in $(make --eval='__p: ; @echo $(DPF_SYSTEM_IMAGE) $(HOSTDRIVER_IMAGE) $(STORAGE_SYSTEM_IMAGE) $(STORAGE_HOST_IMAGE) $(BFB_REGISTRY_IMAGE) $(KEEPALIVED_IMAGE)' __p); do
            docker buildx imagetools create -t "$image:$TAG" \
              "$image:$TAG-amd64" "$image:$TAG-arm64"
          done

      - name: Verify both architectures are present
        run: |
          for image in $(make --eval='__p: ; @echo $(DPF_SYSTEM_IMAGE) $(HOSTDRIVER_IMAGE) $(STORAGE_SYSTEM_IMAGE) $(STORAGE_HOST_IMAGE) $(BFB_REGISTRY_IMAGE) $(KEEPALIVED_IMAGE)' __p); do
            docker buildx imagetools inspect "$image:$TAG" > /tmp/manifest
            grep -q 'linux/amd64' /tmp/manifest || { echo "$image is missing amd64"; exit 1; }
            grep -q 'linux/arm64' /tmp/manifest || { echo "$image is missing arm64"; exit 1; }
            echo "$image:$TAG has both architectures"
          done

  charts:
    needs: images
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache pinned tools
        uses: actions/cache@v5
        with:
          path: hack/tools/bin
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/tools/tools.mk') }}
          restore-keys: tools-${{ runner.os }}-${{ runner.arch }}-

      # Helm packages the chart with this as its version, so it has to be valid semver. A
      # bare sha is not, and the images and charts share one tag because the chart values
      # reference the image tag.
      - name: Resolve the tag
        run: echo "TAG=v0.0.0-sha.$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Package the charts
        run: make helm-package-all

      # helm does not read ~/.docker/config.json for OCI pushes in every version, so it needs its
      # own login. helm-package-all has already fetched the pinned binary by this point.
      - name: Log helm in to the registry
        run: |
          echo "${{ secrets.OCI_TOKEN }}" | hack/tools/bin/helm registry login oci.s3rj1k.fyi \
            --username "${{ secrets.OCI_USERNAME }}" --password-stdin

      - name: Push the charts
        run: make helm-push-all

      - name: Summarise
        run: |
          {
            echo "### Published to \`$REGISTRY\` at \`$TAG\`"
            echo
            echo '```'
            echo "helm upgrade --install -n dpf-operator-system dpf-operator \\"
            echo "  oci://$REGISTRY/dpf-operator --version $TAG --set clusterManager=static"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
